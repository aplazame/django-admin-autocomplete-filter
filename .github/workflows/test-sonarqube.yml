name: Test SonarQube

on:
  push:
    branches:
      - pre_release
      - dev
      - master

permissions:
  contents: read

jobs:
  sonarqube:
    name: Test SonarQube Scan
    runs-on: ${{ vars.AWS_RG_NAME_PRO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: SonarQube Scan  
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: aplazame/.github/workflows/test-reusable-sonarqube.yml@master
        secrets: 
          SONAR_TOKEN: ${{ secrets.WZ_SONAR_TOKEN }}
